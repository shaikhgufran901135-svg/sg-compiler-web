<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SG Code Compiler - Practice & Demo Tool</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/theme/material-darker.min.css"> 
  
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e8f5e9; color: #0b3d0b; transition: background 0.3s, color 0.3s; }
    
    header { 
      background: linear-gradient(135deg, #1b5e20, #2e7d32);
      padding: 14px 20px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      color: white; font-size: 22px; font-weight: bold;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2); 
    }
    header span { font-size: 20px; font-weight: bold; letter-spacing: 0.3px; }
    
    .container { display: flex; flex-wrap: wrap; padding: 20px; gap: 20px; max-width: 1200px; margin: 0 auto; }
    .editor, .output { flex: 1 1 450px; background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); min-width: 300px; }
    
    /* --- NEW MODERN EDITOR HEADER & LANGUAGE SELECTOR --- */
    .editor-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 2px solid #a5d6a7;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .editor-top-bar h3 { margin: 0; border: none; padding: 0; color: #1b5e20; font-size: 19px; }
    
    .select-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    #languageSelector {
      appearance: none;
      -webkit-appearance: none;
      padding: 8px 34px 8px 14px;
      border-radius: 8px;
      border: 1.5px solid #2e7d32;
      background-color: #f1f8e9;
      color: #1b5e20;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
    }
    #languageSelector:hover { background-color: #e8f5e9; box-shadow: 0 2px 8px rgba(46,125,50,0.18); }
    .select-arrow {
      position: absolute;
      right: 12px;
      pointer-events: none;
      font-size: 11px;
      color: #1b5e20;
    }

    /* Language Pill Bar */
    .lang-pill-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 2px 12px 2px;
      margin-bottom: 6px;
      scrollbar-width: thin;
    }
    .lang-pill-bar::-webkit-scrollbar { height: 5px; }
    .lang-pill-bar::-webkit-scrollbar-thumb { background: #a5d6a7; border-radius: 10px; }

    .lang-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      border-radius: 20px;
      border: 1.5px solid #c8e6c9;
      background: #f9fbe7;
      color: #2e7d32;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      user-select: none;
    }
    .lang-pill:hover {
      transform: translateY(-1px);
      border-color: #2e7d32;
      background: #e8f5e9;
    }
    .lang-pill.active {
      background: linear-gradient(135deg, #2e7d32, #43a047);
      color: #ffffff;
      border-color: #1b5e20;
      box-shadow: 0 3px 8px rgba(46, 125, 50, 0.3);
    }
    .lang-pill.locked {
      background: #f5f5f5;
      color: #616161;
      border-color: #e0e0e0;
    }
    .lang-pill.locked:hover {
      border-color: #ffb300;
      background: #fff8e1;
      color: #e65100;
    }
    .ad-badge {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 10px;
      background: #fff3e0;
      color: #e65100;
      border: 1px solid #ffe0b2;
      font-weight: 700;
    }
    .lang-pill.active .ad-badge {
      background: rgba(255,255,255,0.2);
      color: #fff;
      border-color: transparent;
    }

    h3 { margin-top: 0; color: #1b5e20; border-bottom: 2px solid #a5d6a7; padding-bottom: 10px; }
    
    .CodeMirror { height: 350px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; box-sizing: border-box; }
    .CodeMirror-scroll { max-height: 350px; overflow-y: auto; }
    .CodeMirror-lines { padding: 4px 0; }

    .controls { margin-top: 15px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; background: #f1f8e9; padding: 10px; border-radius: 8px; }
    button { background-color: #2e7d32; color: white; padding: 10px 18px; border: none; border-radius: 7px; cursor: pointer; font-size: 14px; font-weight: bold; transition: 0.25s; }
    button:hover { background-color: #1b5e20; transform: translateY(-1px); }
    
    #darkModeToggle { background-color: #fdd835; color: #000; padding: 8px 15px; font-size: 14px; font-weight: bold; border-radius: 20px; }
    #darkModeToggle:hover { background-color: #fbc02d; }
    #resetDefaultBtn { background-color: #fbc02d; color: #111; }
    #resetDefaultBtn:hover { background-color: #f9a825; }
    #clearEditorBtn { background-color: #d32f2f; }
    #clearEditorBtn:hover { background-color: #b71c1c; }
    #copyOutputBtn { background-color: #0288d1; }
    #copyOutputBtn:hover { background-color: #01579b; }
    
    pre { background:#263238; color: #eceff1; padding:15px; border-radius:8px; height:350px; overflow:auto; white-space: pre-wrap; font-family: 'Consolas', monospace; font-size: 14px; }

    /* --- UNLOCK MODAL POPUP --- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 16px;
    }
    .modal-overlay.show { display: flex; }
    .unlock-card {
      background: #ffffff;
      color: #1f2937;
      width: 100%;
      max-width: 380px;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      animation: popIn 0.25s ease-out;
    }
    @keyframes popIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .unlock-icon {
      width: 60px;
      height: 60px;
      background: #fff8e1;
      border: 2px solid #ffca28;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 12px auto;
    }
    .unlock-card h4 { margin: 0 0 6px 0; font-size: 20px; color: #1b5e20; }
    .unlock-card p { margin: 0 0 18px 0; font-size: 14px; color: #555; line-height: 1.4; }
    
    .progress-steps {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .step-box {
      flex: 1;
      padding: 8px 4px;
      border-radius: 8px;
      background: #f1f5f9;
      border: 1.5px solid #e2e8f0;
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
      transition: 0.3s;
    }
    .step-box.completed {
      background: #e8f5e9;
      border-color: #2e7d32;
      color: #1b5e20;
    }
    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background: #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 18px;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff9800, #2e7d32);
      border-radius: 10px;
      transition: width 0.35s ease;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
    }
    .btn-watch-ad {
      flex: 1;
      background: linear-gradient(135deg, #ff8f00, #f57c00);
      color: #fff;
      font-size: 15px;
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 4px 12px rgba(245, 124, 0, 0.3);
    }
    .btn-watch-ad:hover { background: linear-gradient(135deg, #f57c00, #e65100); }
    .btn-cancel {
      background: #e2e8f0;
      color: #334155;
      padding: 12px 16px;
      border-radius: 10px;
    }
    .btn-cancel:hover { background: #cbd5e1; }

    /* --- DARK MODE --- */
    .dark-mode { background-color: #121212 !important; color: #e0e0e0 !important; }
    .dark-mode header { background: linear-gradient(135deg, #00332c, #004d40); color: #fff; }
    .dark-mode .editor, .dark-mode .output { background: #1e1e1e; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .dark-mode h3, .dark-mode .editor-top-bar h3 { color: #80cbc4; }
    .dark-mode .editor-top-bar { border-bottom-color: #004d40; }
    .dark-mode #languageSelector { background-color: #263238; color: #80cbc4; border-color: #00695c; }
    .dark-mode .select-arrow { color: #80cbc4; }
    .dark-mode .lang-pill { background: #263238; color: #b2dfdb; border-color: #37474f; }
    .dark-mode .lang-pill.active { background: linear-gradient(135deg, #00695c, #00897b); color: #fff; border-color: #00bfa5; }
    .dark-mode .lang-pill.locked { background: #1a1a1a; color: #757575; border-color: #2c2c2c; }
    .dark-mode .ad-badge { background: #3e2723; color: #ffb74d; border-color: #5d4037; }
    .dark-mode .controls { background: #212121; }
    .dark-mode button { background-color: #00695c; }
    .dark-mode button:hover { background-color: #00897b; }
    .dark-mode #darkModeToggle { background-color: #64dd17; color: #000; }
    .dark-mode .unlock-card { background: #1e1e1e; color: #e0e0e0; border: 1px solid #333; }
    .dark-mode .unlock-card h4 { color: #80cbc4; }
    .dark-mode .unlock-card p { color: #b0bec5; }
    .dark-mode .step-box { background: #263238; border-color: #37474f; color: #90a4ae; }
    .dark-mode .step-box.completed { background: #004d40; border-color: #00bfa5; color: #e0f2f1; }
    .dark-mode .btn-cancel { background: #37474f; color: #eceff1; }
  </style>
</head>
<body onload="initializeEditor()">
  <header>
    <span>💻 SG Code Compiler</span>
    <button id="darkModeToggle" onclick="toggleDarkMode()">☀️ Light</button> 
  </header>

  <div class="container">
    <div class="editor">
      <!-- Improved Top Bar with Dropdown -->
      <div class="editor-top-bar">
        <h3>Write Your Code</h3>
        <div class="select-wrapper">
          <select id="languageSelector" onchange="changeLanguage()">
            <option value="c">C</option>
            <option value="python">Python</option>
            <option value="java">Java</option>
            <option value="cpp" data-locked="true">C++ 🔒 (0/3)</option>
            <option value="javascript" data-locked="true">JavaScript 🔒 (0/3)</option>
            <option value="php" data-locked="true">PHP 🔒 (0/3)</option>
            <option value="ruby" data-locked="true">Ruby 🔒 (0/3)</option>
            <option value="go" data-locked="true">Go 🔒 (0/3)</option>
          </select>
          <span class="select-arrow">▼</span>
        </div>
      </div>

      <!-- New Modern Interactive Language Pill Bar -->
      <div class="lang-pill-bar" id="langPillBar"></div>
      
      <textarea id="code"></textarea>

      <div class="controls">
        <button onclick="runCode()">▶ Run Code</button>
        <button onclick="clearOutput()">Clear Output</button>
        <button id="resetDefaultBtn" onclick="resetDefaultCode()">🔄 Reset Default</button> 
        <button id="clearEditorBtn" onclick="clearEditor()">Clear Editor</button>
      </div>
      <p style="font-size:12px; color: #1b5e20; margin-top: 8px;">*Code & unlocked languages are saved automatically.</p>
    </div>

    <div class="output">
      <h3>Output</h3>
      <pre id="outputBox">(Output will appear here)</pre>
      <button id="copyOutputBtn" onclick="copyOutput()">📋 Copy Output</button>
    </div>
  </div>

  <!-- 3-Rewarded Ads Unlock Modal -->
  <div class="modal-overlay" id="unlockModal">
    <div class="unlock-card">
      <div class="unlock-icon">🔒</div>
      <h4 id="modalTitle">Unlock Premium Language</h4>
      <p id="modalDesc">Watch 3 short video ads to permanently unlock this compiler language.</p>
      
      <div class="progress-steps">
        <div class="step-box" id="step1">Ad 1</div>
        <div class="step-box" id="step2">Ad 2</div>
        <div class="step-box" id="step3">Ad 3</div>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="modalProgressBar"></div>
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeUnlockModal()">Later</button>
        <button class="btn-watch-ad" id="watchAdBtn" onclick="triggerRewardedAd()">🎬 Watch Ad (0/3)</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/clike/clike.min.js"></script> 
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/javascript/javascript.min.js"></script>
  
  <script>
    let editor; 
    const REQUIRED_ADS = 3;
    let currentUnlockedLang = 'c';
    let pendingUnlockLang = null;
    let waitingForAdCallback = false;

    const languageConfig = {
      c:          { name: 'C',          icon: '⚙️', free: true,  mode: 'text/x-csrc',       judgeId: 50 },
      python:     { name: 'Python',     icon: '🐍', free: true,  mode: 'text/x-python',     judgeId: 71 },
      java:       { name: 'Java',       icon: '☕', free: true,  mode: 'text/x-java',       judgeId: 62 },
      cpp:        { name: 'C++',        icon: '🚀', free: false, mode: 'text/x-c++src',     judgeId: 54 },
      javascript: { name: 'JavaScript', icon: '⚡', free: false, mode: 'text/javascript',   judgeId: 63 },
      php:        { name: 'PHP',        icon: '🐘', free: false, mode: 'text/x-csrc',       judgeId: 68 },
      ruby:       { name: 'Ruby',       icon: '💎', free: false, mode: 'text/x-python',     judgeId: 72 },
      go:         { name: 'Go',         icon: '🐹', free: false, mode: 'text/x-csrc',       judgeId: 60 }
    };

    // Default Codes
    const defaultCodes = {
      c: `#include <stdio.h>\n\nint main() {\n    int num = 10;\n    printf("Hello from C compiler! The number is %d.\\n", num);\n    return 0;\n}`,
      python: `# Python Example\nprint("Hello from Python!")\nprint("The actual compiler is working now.")`,
      java: `// Java Example\nclass Main {\n    public static void main(String[] args) {\n        System.out.println("Hello from Java!");\n    }\n}`,
      cpp: `#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << "Hello from Premium C++ Compiler!" << endl;\n    return 0;\n}`,
      javascript: `// JavaScript Example\nconsole.log("Hello from Premium JavaScript Compiler!");`,
      php: `<?php\necho "Hello from Premium PHP Compiler!\\n";\n?>`,
      ruby: `# Ruby Example\nputs "Hello from Premium Ruby Compiler!"`,
      go: `package main\nimport "fmt"\n\nfunc main() {\n    fmt.Println("Hello from Premium Go Compiler!")\n}`
    };

    function getAdsWatched(lang) {
      if (languageConfig[lang]?.free) return REQUIRED_ADS;
      return parseInt(localStorage.getItem(`sg_ads_${lang}`) || '0', 10);
    }

    function setAdsWatched(lang, count) {
      localStorage.setItem(`sg_ads_${lang}`, String(count));
    }

    function isLanguageUnlocked(lang) {
      return languageConfig[lang]?.free || getAdsWatched(lang) >= REQUIRED_ADS;
    }

    function toggleDarkMode() {
      const body = document.body;
      const toggleBtn = document.getElementById('darkModeToggle');
      body.classList.toggle('dark-mode');
      if (body.classList.contains('dark-mode')) {
        toggleBtn.innerText = '🌙 Dark';
        localStorage.setItem('darkModeEnabled', 'true');
      } else {
        toggleBtn.innerText = '☀️ Light';
        localStorage.removeItem('darkModeEnabled');
      }
    }

    // Refresh both Dropdown and Pill Bar UI
    function updateLanguageUI() {
      const selector = document.getElementById('languageSelector');
      const pillBar = document.getElementById('langPillBar');
      pillBar.innerHTML = '';

      for (let i = 0; i < selector.options.length; i++) {
        const opt = selector.options[i];
        const langKey = opt.value;
        const cfg = languageConfig[langKey];
        const watched = getAdsWatched(langKey);
        const unlocked = isLanguageUnlocked(langKey);

        // Update <select> option text & attributes
        if (cfg.free) {
          opt.text = `${cfg.icon} ${cfg.name}`;
          opt.removeAttribute('data-locked');
        } else if (unlocked) {
          opt.text = `${cfg.icon} ${cfg.name} 🔓`;
          opt.removeAttribute('data-locked');
        } else {
          opt.text = `${cfg.icon} ${cfg.name} 🔒 (${watched}/${REQUIRED_ADS})`;
          opt.setAttribute('data-locked', 'true');
        }

        // Create Interactive Pill
        const pill = document.createElement('div');
        pill.className = `lang-pill ${langKey === currentUnlockedLang ? 'active' : ''} ${!unlocked ? 'locked' : ''}`;
        
        let badgeHTML = '';
        if (!cfg.free) {
          badgeHTML = unlocked 
            ? `<span class="ad-badge">🔓</span>` 
            : `<span class="ad-badge">🔒 ${watched}/${REQUIRED_ADS}</span>`;
        }

        pill.innerHTML = `<span>${cfg.icon} ${cfg.name}</span> ${badgeHTML}`;
        pill.onclick = () => selectLanguageFromPill(langKey);
        pillBar.appendChild(pill);
      }

      selector.value = currentUnlockedLang;
    }

    function selectLanguageFromPill(langKey) {
      const selector = document.getElementById('languageSelector');
      selector.value = langKey;
      changeLanguage();
    }

    function initializeEditor() {
      if (localStorage.getItem('darkModeEnabled') === 'true') {
        document.body.classList.add('dark-mode');
        document.getElementById('darkModeToggle').innerText = '🌙 Dark';
      }

      const savedLang = localStorage.getItem('selectedLanguage') || 'c';
      currentUnlockedLang = isLanguageUnlocked(savedLang) ? savedLang : 'c';

      const savedCode = localStorage.getItem('sgCompilerCode');
      const cfg = languageConfig[currentUnlockedLang];

      editor = CodeMirror.fromTextArea(document.getElementById('code'), {
        mode: cfg.mode, 
        theme: 'material-darker',     
        lineNumbers: true,    
        indentUnit: 4,        
        tabSize: 4,
        indentWithTabs: true,
        electricChars: true,
        matchBrackets: true,
        autoCloseBrackets: true,
      });

      editor.setValue(savedCode || defaultCodes[currentUnlockedLang]); 
      editor.on('change', saveCode);

      updateLanguageUI();

      // App startup language check
      if (typeof AndroidApp !== "undefined" && AndroidApp.checkLanguageStatus) {
        AndroidApp.checkLanguageStatus(); 
      }
    }
    
    function changeLanguage() {
      const selector = document.getElementById('languageSelector');
      const lang = selector.value;

      // Check if language is locked (needs 3 ads)
      if (!isLanguageUnlocked(lang)) {
        selector.value = currentUnlockedLang; // Keep editor on previous unlocked language
        openUnlockModal(lang);
        return;
      }

      applyLanguageSwitch(lang);
    }

    function applyLanguageSwitch(lang) {
      currentUnlockedLang = lang;
      const cfg = languageConfig[lang];
      editor.setOption('mode', cfg.mode);
      editor.setValue(defaultCodes[lang]);
      localStorage.setItem('selectedLanguage', lang);
      updateLanguageUI();
    }

    // --- 3 ADS UNLOCK MODAL FUNCTIONS ---
    function openUnlockModal(langKey) {
      pendingUnlockLang = langKey;
      const cfg = languageConfig[langKey];
      const watched = getAdsWatched(langKey);
      const remaining = REQUIRED_ADS - watched;

      document.getElementById('modalTitle').innerText = `Unlock ${cfg.icon} ${cfg.name}`;
      document.getElementById('modalDesc').innerText = 
        `Watch ${remaining} more short video ad${remaining > 1 ? 's' : ''} to unlock ${cfg.name} compiler! (${watched}/${REQUIRED_ADS} completed)`;

      // Update Step Boxes
      for (let i = 1; i <= 3; i++) {
        const stepEl = document.getElementById(`step${i}`);
        if (i <= watched) {
          stepEl.classList.add('completed');
          stepEl.innerText = `Ad ${i} ✅`;
        } else {
          stepEl.classList.remove('completed');
          stepEl.innerText = `Ad ${i} 🔒`;
        }
      }

      // Update Progress Bar
      const pct = Math.min(100, Math.round((watched / REQUIRED_ADS) * 100));
      document.getElementById('modalProgressBar').style.width = `${pct}%`;
      document.getElementById('watchAdBtn').innerText = `🎬 Watch Ad (${watched}/${REQUIRED_ADS})`;

      document.getElementById('unlockModal').classList.add('show');
    }

    function closeUnlockModal() {
      document.getElementById('unlockModal').classList.remove('show');
    }

    function triggerRewardedAd() {
      if (!pendingUnlockLang) return;
      if (typeof AndroidApp !== "undefined" && AndroidApp.showRewardedAd) {
        waitingForAdCallback = true;
        AndroidApp.showRewardedAd(pendingUnlockLang);
      } else {
        alert("This premium language can only be unlocked by watching 3 short video ads inside the SG Code Compiler Android App!");
      }
    }

    // Android App calls this function after an ad is completed
    function unlockLanguage(langId) {
      if (!languageConfig[langId]) return;

      // Ignore startup check calls if 3 ads aren't completed yet
      if (!waitingForAdCallback && getAdsWatched(langId) < REQUIRED_ADS) {
        updateLanguageUI();
        return;
      }

      waitingForAdCallback = false;
      let watched = getAdsWatched(langId) + 1;
      if (watched > REQUIRED_ADS) watched = REQUIRED_ADS;
      setAdsWatched(langId, watched);

      updateLanguageUI();

      if (watched >= REQUIRED_ADS) {
        closeUnlockModal();
        applyLanguageSwitch(langId);
        alert(`🎉 Congratulations! ${languageConfig[langId].name} is now Unlocked! (${REQUIRED_ADS}/${REQUIRED_ADS} Ads Watched)`);
      } else {
        openUnlockModal(langId);
      }
    }

    function saveCode() {
      const codeText = editor.getValue(); 
      localStorage.setItem('sgCompilerCode', codeText);
    }
    
    function resetDefaultCode() {
      const lang = currentUnlockedLang;
      const defaultCodeToLoad = defaultCodes[lang] || defaultCodes.c;

      if (confirm(`Are you sure you want to reset the code to the default ${languageConfig[lang].name} example?`)) {
        editor.setValue(defaultCodeToLoad);
      }
    }

    function clearEditor() {
      if (confirm("Are you sure you want to clear all code in the editor?")) {
        editor.setValue(''); 
        localStorage.removeItem('sgCompilerCode'); 
      }
    }

    function copyOutput() {
      const outputText = document.getElementById('outputBox').innerText;
      navigator.clipboard.writeText(outputText).then(() => {
        alert('Output copied to clipboard!');
      }).catch(err => {
        console.error('Failed to copy text: ', err);
        alert('Could not copy output. Please try manually.');
      });
    }

    async function runCode() {
      const code = editor.getValue(); 
      const outputBox = document.getElementById('outputBox');
      const lang = currentUnlockedLang; 
      const cfg = languageConfig[lang];
      
      outputBox.innerText = `Compiling & Running ${cfg.name} on Server... Please wait.`;
      
      try {
        const response = await fetch('https://compiler-backend-4dbz.onrender.com/compile', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ language_id: cfg.judgeId, source_code: code, stdin: "" })
        });

        const result = await response.json();

        if (result.error) {
          outputBox.innerText = "Server Error:\n" + (result.message || "Something went wrong.");
          return;
        }

        if (result.compile_output) {
          outputBox.innerText = "Compilation Error:\n" + result.compile_output;
        } else if (result.stderr) {
          outputBox.innerText = "Runtime Error:\n" + result.stderr;
        } else if (result.stdout !== null && result.stdout !== undefined) {
          outputBox.innerText = result.stdout || "Program executed successfully but returned no output.";
        } else if (result.status && result.status.description) {
          outputBox.innerText = "Status:\n" + result.status.description;
        } else {
          outputBox.innerText = "Something went wrong. Please check console.";
          console.log(result);
        }

      } catch (error) {
        outputBox.innerText = `Network Error: Server is not reachable.\nDetails: ${error.message}`;
        console.error("Fetch Error:", error);
      }
    }

    function clearOutput() {
      document.getElementById('outputBox').innerText = "(Output cleared)";
    }
  </script>
</body>
</html>
