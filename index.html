<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SG Code Compiler</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/theme/material-darker.min.css"> 
  
  <style>
    :root {
      --bg-primary: #F2F2F7;
      --bg-card: #FFFFFF;
      --bg-secondary: #E5E5EA;
      --text-primary: #1C1C1E;
      --text-secondary: #8E8E93;
      --accent-blue: #007AFF;
      --accent-green: #34C759;
      --accent-orange: #FF9500;
      --accent-red: #FF3B30;
      --border-color: rgba(60, 60, 67, 0.12);
      --header-bg: rgba(255, 255, 255, 0.82);
      --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    .dark-mode {
      --bg-primary: #000000;
      --bg-card: #1C1C1E;
      --bg-secondary: #2C2C2E;
      --text-primary: #F2F2F7;
      --text-secondary: #98989D;
      --accent-blue: #0A84FF;
      --accent-green: #30D158;
      --accent-orange: #FF9F0A;
      --accent-red: #FF453A;
      --border-color: rgba(255, 255, 255, 0.12);
      --header-bg: rgba(28, 28, 30, 0.82);
      --card-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    /* PULL-TO-REFRESH FIX */
    html, body {
      margin: 0;
      padding: 0;
      overscroll-behavior-y: none;
      overscroll-behavior: none;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* iOS Frosted Glass Navigation Bar */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--header-bg);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 0.5px solid var(--border-color);
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: var(--text-primary);
    }

    .brand-badge {
      background: var(--accent-blue);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      letter-spacing: 0.3px;
    }

    #darkModeToggle {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 0.5px solid var(--border-color);
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s;
    }
    #darkModeToggle:active { transform: scale(0.94); }

    .container {
      display: flex;
      flex-wrap: wrap;
      padding: 14px;
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .editor, .output {
      flex: 1 1 450px;
      background: var(--bg-card);
      padding: 16px;
      border-radius: 18px;
      border: 0.5px solid var(--border-color);
      box-shadow: var(--card-shadow);
      min-width: 300px;
    }

    /* Card Top Header */
    .editor-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .card-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mac-dots {
      display: flex;
      gap: 6px;
    }
    .mac-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
    }
    .dot-red { background: #FF5F56; }
    .dot-yellow { background: #FFBD2E; }
    .dot-green { background: #27C93F; }

    .editor-top-bar h3, .output-header h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text-primary);
    }

    /* iOS Dropdown Selector */
    .select-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    #languageSelector {
      appearance: none;
      -webkit-appearance: none;
      padding: 7px 30px 7px 12px;
      border-radius: 10px;
      border: 0.5px solid var(--border-color);
      background-color: var(--bg-secondary);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }
    .select-arrow {
      position: absolute;
      right: 10px;
      pointer-events: none;
      font-size: 10px;
      color: var(--text-secondary);
    }

    /* iOS Segmented Pill Bar */
    .lang-pill-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 2px 12px 2px;
      margin-bottom: 4px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .lang-pill-bar::-webkit-scrollbar { display: none; }

    .lang-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      border-radius: 999px;
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      border: 1px solid transparent;
      transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
      user-select: none;
    }
    .lang-pill:active { transform: scale(0.95); }

    .lang-pill.active {
      background: var(--accent-blue);
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
    }

    .lang-pill.locked {
      opacity: 0.85;
    }

    .ad-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 8px;
      background: rgba(255, 149, 0, 0.16);
      color: var(--accent-orange);
      font-weight: 700;
    }
    .lang-pill.active .ad-badge {
      background: rgba(255, 255, 255, 0.22);
      color: #FFFFFF;
    }

    /* CODEMIRROR COMPACT LINE SPACING FIX */
    .CodeMirror {
      height: 330px;
      border-radius: 12px;
      border: 0.5px solid var(--border-color);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace !important;
      font-size: 13.5px !important;
      line-height: 1.35 !important;
      direction: ltr;
    }
    .CodeMirror-scroll {
      max-height: 330px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    .CodeMirror-lines {
      padding: 8px 0 !important;
    }
    .CodeMirror pre.CodeMirror-line,
    .CodeMirror pre.CodeMirror-line-like {
      line-height: 1.35 !important;
      padding: 0 8px !important;
      margin: 0 !important;
    }
    .CodeMirror-linenumber {
      line-height: 1.35 !important;
      padding: 0 6px 0 4px !important;
      font-size: 12px !important;
    }

    /* iOS Action Controls */
    .controls {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    @media (min-width: 520px) {
      .controls {
        display: flex;
        flex-wrap: wrap;
      }
    }

    button.ios-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px 16px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.2px;
      transition: transform 0.12s ease, opacity 0.2s;
      color: #FFFFFF;
    }
    button.ios-btn:active {
      transform: scale(0.96);
      opacity: 0.9;
    }

    .btn-run {
      background: var(--accent-green);
      box-shadow: 0 4px 12px rgba(52, 199, 89, 0.28);
      flex: 1.2;
    }
    .btn-secondary {
      background: var(--bg-secondary);
      color: var(--text-primary) !important;
      flex: 1;
    }
    .btn-reset {
      background: rgba(255, 149, 0, 0.15);
      color: var(--accent-orange) !important;
      flex: 1;
    }
    .btn-danger {
      background: rgba(255, 59, 48, 0.14);
      color: var(--accent-red) !important;
      flex: 1;
    }
    .btn-copy {
      width: 100%;
      margin-top: 12px;
      background: var(--accent-blue);
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.25);
    }

    .auto-save-note {
      font-size: 11.5px;
      color: var(--text-secondary);
      margin: 10px 0 0 2px;
    }

    /* Output Console Box */
    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .terminal-tag {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--bg-secondary);
      padding: 4px 9px;
      border-radius: 8px;
    }

    pre#outputBox {
      background: #141417;
      color: #E5E5EA;
      padding: 14px;
      border-radius: 12px;
      border: 0.5px solid var(--border-color);
      height: 330px;
      margin: 0;
      overflow: auto;
      overscroll-behavior: contain;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: "SFMono-Regular", Consolas, Menlo, monospace;
      font-size: 13px;
      line-height: 1.4;
    }

    /* iOS Modal Sheet for 3 Ads Unlock */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 18px;
    }
    .modal-overlay.show { display: flex; }

    .unlock-card {
      background: var(--bg-card);
      color: var(--text-primary);
      width: 100%;
      max-width: 360px;
      border-radius: 24px;
      padding: 24px 20px 20px 20px;
      text-align: center;
      border: 0.5px solid var(--border-color);
      box-shadow: 0 20px 40px rgba(0,0,0,0.35);
      animation: iosSheetPop 0.22s cubic-bezier(0.32, 0.72, 0, 1);
    }
    @keyframes iosSheetPop {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .unlock-icon {
      width: 56px;
      height: 56px;
      background: rgba(255, 149, 0, 0.14);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin: 0 auto 12px auto;
    }
    .unlock-card h4 {
      margin: 0 0 6px 0;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .unlock-card p {
      margin: 0 0 16px 0;
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .progress-steps {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .step-box {
      flex: 1;
      padding: 8px 4px;
      border-radius: 10px;
      background: var(--bg-secondary);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      transition: 0.25s;
    }
    .step-box.completed {
      background: rgba(52, 199, 89, 0.16);
      color: var(--accent-green);
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: var(--bg-secondary);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 18px;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
      border-radius: 99px;
      transition: width 0.35s ease;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }
    .btn-watch-ad {
      flex: 1.5;
      background: var(--accent-blue);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      padding: 12px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    .btn-cancel {
      flex: 1;
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 600;
      padding: 12px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body onload="initializeEditor()">
  <header>
    <div class="brand-title">
      <span>SG Compiler</span>
      <span class="brand-badge">PRO</span>
    </div>
    <button id="darkModeToggle" onclick="toggleDarkMode()">☀️ Light</button> 
  </header>

  <div class="container">
    <div class="editor">
      <div class="editor-top-bar">
        <div class="card-title-group">
          <div class="mac-dots">
            <span class="mac-dot dot-red"></span>
            <span class="mac-dot dot-yellow"></span>
            <span class="mac-dot dot-green"></span>
          </div>
          <h3>Code Editor</h3>
        </div>
        <div class="select-wrapper">
          <select id="languageSelector" onchange="changeLanguage()">
            <option value="c">C</option>
            <option value="python">Python</option>
            <option value="java">Java</option>
            <option value="cpp" data-locked="true">C++ 🔒 (0/3)</option>
            <option value="javascript" data-locked="true">JavaScript 🔒 (0/3)</option>
            <option value="php" data-locked="true">PHP 🔒 (0/3)</option>
            <option value="ruby" data-locked="true">Ruby 🔒 (0/3)</option>
            <option value="go" data-locked="true">Go 🔒 (0/3)</option>
          </select>
          <span class="select-arrow">▼</span>
        </div>
      </div>

      <!-- iOS Segmented Language Bar -->
      <div class="lang-pill-bar" id="langPillBar"></div>
      
      <textarea id="code"></textarea>

      <div class="controls">
        <button class="ios-btn btn-run" onclick="runCode()">▶ Run Code</button>
        <button class="ios-btn btn-secondary" onclick="clearOutput()">Clear Output</button>
        <button class="ios-btn btn-reset" id="resetDefaultBtn" onclick="resetDefaultCode()">↺ Reset</button> 
        <button class="ios-btn btn-danger" id="clearEditorBtn" onclick="clearEditor()">✕ Clear</button>
      </div>
      <p class="auto-save-note">✓ Auto-saved locally on your device</p>
    </div>

    <div class="output">
      <div class="output-header">
        <div class="card-title-group">
          <div class="mac-dots">
            <span class="mac-dot dot-red"></span>
            <span class="mac-dot dot-yellow"></span>
            <span class="mac-dot dot-green"></span>
          </div>
          <h3>Console Output</h3>
        </div>
        <span class="terminal-tag" id="activeLangTag">C • Ready</span>
      </div>
      <pre id="outputBox">(Output will appear here)</pre>
      <button class="ios-btn btn-copy" id="copyOutputBtn" onclick="copyOutput()">📋 Copy Output</button>
    </div>
  </div>

  <!-- iOS 3-Rewarded Ads Unlock Modal -->
  <div class="modal-overlay" id="unlockModal">
    <div class="unlock-card">
      <div class="unlock-icon">🔒</div>
      <h4 id="modalTitle">Unlock Language</h4>
      <p id="modalDesc">Watch 3 short video ads to permanently unlock this compiler language.</p>
      
      <div class="progress-steps">
        <div class="step-box" id="step1">Ad 1</div>
        <div class="step-box" id="step2">Ad 2</div>
        <div class="step-box" id="step3">Ad 3</div>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="modalProgressBar"></div>
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeUnlockModal()">Cancel</button>
        <button class="btn-watch-ad" id="watchAdBtn" onclick="triggerRewardedAd()">🎬 Watch Ad (0/3)</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/clike/clike.min.js"></script> 
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/javascript/javascript.min.js"></script>
  
  <script>
    let editor; 
    const REQUIRED_ADS = 3;
    let currentUnlockedLang = 'c';
    let pendingUnlockLang = null;
    let waitingForAdCallback = false;

    // Prevent accidental WebView pull-to-refresh when dragging down at top of page
    let touchStartY = 0;
    document.addEventListener('touchstart', function(e) {
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    document.addEventListener('touchmove', function(e) {
      const touchY = e.touches[0].clientY;
      const touchDiff = touchY - touchStartY;
      if (window.scrollY === 0 && touchDiff > 0 && !e.target.closest('.CodeMirror-scroll') && !e.target.closest('#outputBox') && !e.target.closest('.lang-pill-bar')) {
        e.preventDefault();
      }
    }, { passive: false });

    const languageConfig = {
      c:          { name: 'C',          icon: '⚙️', free: true,  mode: 'text/x-csrc',       judgeId: 50 },
      python:     { name: 'Python',     icon: '🐍', free: true,  mode: 'text/x-python',     judgeId: 71 },
      java:       { name: 'Java',       icon: '☕', free: true,  mode: 'text/x-java',       judgeId: 62 },
      cpp:        { name: 'C++',        icon: '🚀', free: false, mode: 'text/x-c++src',     judgeId: 54 },
      javascript: { name: 'JavaScript', icon: '⚡', free: false, mode: 'text/javascript',   judgeId: 63 },
      php:        { name: 'PHP',        icon: '🐘', free: false, mode: 'text/x-csrc',       judgeId: 68 },
      ruby:       { name: 'Ruby',       icon: '💎', free: false, mode: 'text/x-python',     judgeId: 72 },
      go:         { name: 'Go',         icon: '🐹', free: false, mode: 'text/x-csrc',       judgeId: 60 }
    };

    const defaultCodes = {
      c: "#include <stdio.h>\n\nint main() {\n    int num = 10;\n    printf(\"Hello from C compiler! Number: %d\\n\", num);\n    return 0;\n}",
      python: "# Python Example\nprint(\"Hello from Python!\")\nfor i in range(1, 4):\n    print(f\"Step {i}: Ready to code\")",
      java: "// Java Example\nclass Main {\n    public static void main(String[] args) {\n        System.out.println(\"Hello from Java!\");\n    }\n}",
      cpp: "#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << \"Hello from C++ Compiler!\" << endl;\n    return 0;\n}",
      javascript: "// JavaScript Example\nconsole.log(\"Hello from JavaScript Compiler!\");",
      php: "<?php\necho \"Hello from PHP Compiler!\\n\";\n?>",
      ruby: "# Ruby Example\nputs \"Hello from Ruby Compiler!\"",
      go: "package main\nimport \"fmt\"\n\nfunc main() {\n    fmt.Println(\"Hello from Go Compiler!\")\n}"
    };

    function getAdsWatched(lang) {
      if (languageConfig[lang]?.free) return REQUIRED_ADS;
      return parseInt(localStorage.getItem(`sg_ads_${lang}`) || '0', 10);
    }

    function setAdsWatched(lang, count) {
      localStorage.setItem(`sg_ads_${lang}`, String(count));
    }

    function isLanguageUnlocked(lang) {
      return languageConfig[lang]?.free || getAdsWatched(lang) >= REQUIRED_ADS;
    }

    function toggleDarkMode() {
      const body = document.body;
      const toggleBtn = document.getElementById('darkModeToggle');
      body.classList.toggle('dark-mode');
      if (body.classList.contains('dark-mode')) {
        toggleBtn.innerText = '🌙 Dark';
        localStorage.setItem('darkModeEnabled', 'true');
      } else {
        toggleBtn.innerText = '☀️ Light';
        localStorage.removeItem('darkModeEnabled');
      }
    }

    function updateLanguageUI() {
      const selector = document.getElementById('languageSelector');
      const pillBar = document.getElementById('langPillBar');
      const activeTag = document.getElementById('activeLangTag');
      pillBar.innerHTML = '';

      for (let i = 0; i < selector.options.length; i++) {
        const opt = selector.options[i];
        const langKey = opt.value;
        const cfg = languageConfig[langKey];
        const watched = getAdsWatched(langKey);
        const unlocked = isLanguageUnlocked(langKey);

        if (cfg.free) {
          opt.text = `${cfg.icon} ${cfg.name}`;
          opt.removeAttribute('data-locked');
        } else if (unlocked) {
          opt.text = `${cfg.icon} ${cfg.name} 🔓`;
          opt.removeAttribute('data-locked');
        } else {
          opt.text = `${cfg.icon} ${cfg.name} 🔒 (${watched}/${REQUIRED_ADS})`;
          opt.setAttribute('data-locked', 'true');
        }

        const pill = document.createElement('div');
        pill.className = `lang-pill ${langKey === currentUnlockedLang ? 'active' : ''} ${!unlocked ? 'locked' : ''}`;
        
        let badgeHTML = '';
        if (!cfg.free) {
          badgeHTML = unlocked 
            ? `<span class="ad-badge">🔓</span>` 
            : `<span class="ad-badge">🔒 ${watched}/${REQUIRED_ADS}</span>`;
        }

        pill.innerHTML = `<span>${cfg.icon} ${cfg.name}</span> ${badgeHTML}`;
        pill.onclick = () => selectLanguageFromPill(langKey);
        pillBar.appendChild(pill);
      }

      selector.value = currentUnlockedLang;
      if (activeTag && languageConfig[currentUnlockedLang]) {
        activeTag.innerText = `${languageConfig[currentUnlockedLang].name} • Ready`;
      }
    }

    function selectLanguageFromPill(langKey) {
      const selector = document.getElementById('languageSelector');
      selector.value = langKey;
      changeLanguage();
    }

    function initializeEditor() {
      if (localStorage.getItem('darkModeEnabled') === 'true') {
        document.body.classList.add('dark-mode');
        document.getElementById('darkModeToggle').innerText = '🌙 Dark';
      }

      const savedLang = localStorage.getItem('selectedLanguage') || 'c';
      currentUnlockedLang = isLanguageUnlocked(savedLang) ? savedLang : 'c';

      const savedCode = localStorage.getItem('sgCompilerCode');
      const cfg = languageConfig[currentUnlockedLang];

      editor = CodeMirror.fromTextArea(document.getElementById('code'), {
        mode: cfg.mode, 
        theme: 'material-darker',     
        lineNumbers: true,    
        indentUnit: 4,        
        tabSize: 4,
        indentWithTabs: false,
        electricChars: true,
        matchBrackets: true,
        autoCloseBrackets: true,
        lineWrapping: false
      });

      editor.setValue(savedCode || defaultCodes[currentUnlockedLang]); 
      editor.on('change', saveCode);

      updateLanguageUI();

      if (typeof AndroidApp !== "undefined" && AndroidApp.checkLanguageStatus) {
        AndroidApp.checkLanguageStatus(); 
      }
    }
    
    function changeLanguage() {
      const selector = document.getElementById('languageSelector');
      const lang = selector.value;

      if (!isLanguageUnlocked(lang)) {
        selector.value = currentUnlockedLang;
        openUnlockModal(lang);
        return;
      }

      applyLanguageSwitch(lang);
    }

    function applyLanguageSwitch(lang) {
      currentUnlockedLang = lang;
      const cfg = languageConfig[lang];
      editor.setOption('mode', cfg.mode);
      editor.setValue(defaultCodes[lang]);
      localStorage.setItem('selectedLanguage', lang);
      updateLanguageUI();
    }

    function openUnlockModal(langKey) {
      pendingUnlockLang = langKey;
      const cfg = languageConfig[langKey];
      const watched = getAdsWatched(langKey);
      const remaining = REQUIRED_ADS - watched;

      document.getElementById('modalTitle').innerText = `Unlock ${cfg.icon} ${cfg.name}`;
      document.getElementById('modalDesc').innerText = 
        `Watch ${remaining} more short video ad${remaining > 1 ? 's' : ''} to permanently unlock ${cfg.name}. (${watched}/${REQUIRED_ADS} completed)`;

      for (let i = 1; i <= 3; i++) {
        const stepEl = document.getElementById(`step${i}`);
        if (i <= watched) {
          stepEl.classList.add('completed');
          stepEl.innerText = `Ad ${i} ✓`;
        } else {
          stepEl.classList.remove('completed');
          stepEl.innerText = `Ad ${i} 🔒`;
        }
      }

      const pct = Math.min(100, Math.round((watched / REQUIRED_ADS) * 100));
      document.getElementById('modalProgressBar').style.width = `${pct}%`;
      document.getElementById('watchAdBtn').innerText = `🎬 Watch Ad (${watched}/${REQUIRED_ADS})`;

      document.getElementById('unlockModal').classList.add('show');
    }

    function closeUnlockModal() {
      document.getElementById('unlockModal').classList.remove('show');
    }

    function triggerRewardedAd() {
      if (!pendingUnlockLang) return;
      if (typeof AndroidApp !== "undefined" && AndroidApp.showRewardedAd) {
        waitingForAdCallback = true;
        AndroidApp.showRewardedAd(pendingUnlockLang);
      } else {
        alert("Watch 3 rewarded video ads inside the SG Code Compiler Android App to unlock this language!");
      }
    }

    function unlockLanguage(langId) {
      if (!languageConfig[langId]) return;

      if (!waitingForAdCallback && getAdsWatched(langId) < REQUIRED_ADS) {
        updateLanguageUI();
        return;
      }

      waitingForAdCallback = false;
      let watched = getAdsWatched(langId) + 1;
      if (watched > REQUIRED_ADS) watched = REQUIRED_ADS;
      setAdsWatched(langId, watched);

      updateLanguageUI();

      if (watched >= REQUIRED_ADS) {
        closeUnlockModal();
        applyLanguageSwitch(langId);
        alert(`🎉 ${languageConfig[langId].name} is now Unlocked!`);
      } else {
        openUnlockModal(langId);
      }
    }

    function saveCode() {
      localStorage.setItem('sgCompilerCode', editor.getValue());
    }
    
    function resetDefaultCode() {
      const lang = currentUnlockedLang;
      if (confirm(`Reset to default ${languageConfig[lang].name} template?`)) {
        editor.setValue(defaultCodes[lang] || defaultCodes.c);
      }
    }

    function clearEditor() {
      if (confirm("Clear all code in the editor?")) {
        editor.setValue(''); 
        localStorage.removeItem('sgCompilerCode'); 
      }
    }

    function copyOutput() {
      const outputText = document.getElementById('outputBox').innerText;
      navigator.clipboard.writeText(outputText).then(() => {
        const btn = document.getElementById('copyOutputBtn');
        btn.innerText = '✓ Copied to Clipboard';
        setTimeout(() => { btn.innerText = '📋 Copy Output'; }, 1800);
      }).catch(() => {
        alert('Could not copy output.');
      });
    }

    async function runCode() {
      const code = editor.getValue(); 
      const outputBox = document.getElementById('outputBox');
      const activeTag = document.getElementById('activeLangTag');
      const lang = currentUnlockedLang; 
      const cfg = languageConfig[lang];
      
      activeTag.innerText = `${cfg.name} • Running...`;
      outputBox.innerText = `Compiling & Running ${cfg.name}...`;
      
      try {
        const response = await fetch('https://compiler-backend-4dbz.onrender.com/compile', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ language_id: cfg.judgeId, source_code: code, stdin: "" })
        });

        const result = await response.json();
        activeTag.innerText = `${cfg.name} • Done`;

        if (result.error) {
          outputBox.innerText = "Server Error:\n" + (result.message || "Something went wrong.");
          return;
        }

        if (result.compile_output) {
          outputBox.innerText = "Compilation Error:\n" + result.compile_output;
        } else if (result.stderr) {
          outputBox.innerText = "Runtime Error:\n" + result.stderr;
        } else if (result.stdout !== null && result.stdout !== undefined) {
          outputBox.innerText = result.stdout || "Program executed successfully (no output).";
        } else if (result.status && result.status.description) {
          outputBox.innerText = "Status:\n" + result.status.description;
        } else {
          outputBox.innerText = "Unknown response from server.";
        }
      } catch (error) {
        activeTag.innerText = `${cfg.name} • Offline`;
        outputBox.innerText = `Network Error: Server is not reachable.\nDetails: ${error.message}`;
      }
    }

    function clearOutput() {
      document.getElementById('outputBox').innerText = "(Output cleared)";
    }
  </script>
</body>
</html>
